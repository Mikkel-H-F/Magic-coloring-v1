function fillAt(x,y){

function drawLine(a,b){ctx.strokeStyle=color;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(glitter){for(let i=0;i<6;i++){let t=Math.random(),x=a.x+(b.x-a.x)*t+(Math.random()-.5)*brushSize,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*brushSize;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x,y,2.5,2.5)}}}
canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(paintLocked)return;let p=point(e);snapshot();if(mode==='fill'){if(!fillAt(p.x,p.y))history.pop();else $('toast').textContent='Flot! 🌈'}else{painting=true;last=p;canvas.setPointerCapture(e.pointerId);drawLine(p,{x:p.x+.1,y:p.y+.1})}},{passive:false});canvas.addEventListener('pointermove',e=>{if(!painting)return;e.preventDefault();let p=point(e);drawLine(last,p);last=p},{passive:false});canvas.addEventListener('pointerup',()=>painting=false);canvas.addEventListener('pointercancel',()=>painting=false);
function setMode(m){mode=m;$('fill').classList.toggle('active',m==='fill');$('brush').classList.toggle('active',m==='brush');$('fill').disabled=!!custom;$('toast').textContent=m==='fill'?'Tryk på et felt for at fylde det 🪣':'Mal med fingeren 🖌️'}
$('fill').onclick=()=>setMode('fill');$('brush').onclick=()=>setMode('brush');$('size').onclick=()=>{brushSize=brushSize===12?24:brushSize===24?40:12;$('size').textContent='● Pensel: '+({12:'lille',24:'mellem',40:'stor'}[brushSize])};
$('undo').onclick=()=>{if(paintLocked){cancelAnimationFrame(animation);paintLocked=false}if(history.length){ctx.putImageData(history.pop(),0,0);$('toast').textContent='Sidste ændring fortrudt ↶'}};
$('clear').onclick=()=>{if(paintLocked){cancelAnimationFrame(animation);paintLocked=false}if(confirm('Vil du starte forfra med dette billede?')){history=[];if(custom)loadArt(custom);else open(selected)}};
$('back').onclick=()=>{$('editor').classList.add('hide');$('home').classList.remove('hide');document.body.classList.remove('editing')};
function renderPalette(){
 let list=glitter?glitterColors:colors;
 $('palette').innerHTML=list.map(c=>`<button class="swatch ${glitter?'sparkle':''}" data-color="${c}" style="background:${c}" aria-label="Farve ${c}">${glitter?'✦':''}</button>`).join('');
 document.querySelectorAll('.swatch').forEach(x=>x.onclick=()=>chooseColor(x.dataset.color));
 chooseColor(list.includes(color)?color:list[0]);
 $('normalTab').classList.toggle('active',!glitter);
 $('glitterTab').classList.toggle('active',glitter);
}
function chooseColor(c){color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x.dataset.color===c))}
$('normalTab').onclick=()=>{glitter=false;renderPalette()};
$('glitterTab').onclick=()=>{glitter=true;renderPalette()};
renderPalette();
$('file').onchange=ev=>{let file=ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{custom=svgContent(`<image href="${reader.result}" x="20" y="20" width="460" height="460" preserveAspectRatio="xMidYMid meet"/>`);history=[];loadArt(custom);setMode('brush')};reader.readAsDataURL(file);ev.target.value=''};
$('download').onclick=()=>{let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='magic-coloring.png';a.click();$('toast').textContent='Billedet er klar til at gemme! 💖'};
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(document.body.classList.contains('editing')&&e.target.closest('#paper'))e.preventDefault()},{passive:false});
gallery();
</script></body></html>
