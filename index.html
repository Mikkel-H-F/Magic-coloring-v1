const glitterCanvas=document.createElement('canvas');glitterCanvas.width=glitterCanvas.height=500;glitterCanvas.id='glitterCanvas';glitterCanvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none';

   if(area.maskCanvas){const off=area.maskCanvas,oc=area.overlayCtx;oc.clearRect(0,0,500,500);oc.fillStyle=`hsl(${(t*.025+area.hue)%360},95%,65%)`;oc.fillRect(0,0,500,500);oc.globalCompositeOperation='destination-in';oc.drawImage(off,0,0);oc.globalCompositeOperation='source-over';gctx.globalAlpha=.35;gctx.drawImage(area.overlay,0,0);gctx.globalAlpha=1}
   gctx.restore();
  }
  for(const p of area.stars){let phase=t*.0025*p.speed+p.phase,tw=(Math.sin(phase)+1)/2;if(tw<.24)continue;

   gctx.save();gctx.translate(p.x,p.y);gctx.rotate(phase*.1);gctx.globalAlpha=(tw-.18)*.95;

   gctx.beginPath();gctx.moveTo(0,-sz*1.8);gctx.lineTo(sz*.22,-sz*.22);gctx.lineTo(sz*1.8,0);gctx.lineTo(sz*.22,sz*.22);gctx.lineTo(0,sz*1.8);gctx.lineTo(-sz*.22,sz*.22);gctx.lineTo(-sz*1.8,0);gctx.lineTo(-sz*.22,-sz*.22);gctx.closePath();gctx.fill();gctx.restore();

 }

}

function snapshot(){history.push({pixels:ctx.getImageData(0,0,500,500),areas:glitterAreas.slice()});if(history.length>25)history.shift()}
function point(ev){let r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(499,Math.floor((ev.clientX-r.left)*500/r.width))),y:Math.max(0,Math.min(499,Math.floor((ev.clientY-r.top)*500/r.height)))}}
function fillAt(x,y){
 if(paintLocked)return false;
 const img=ctx.getImageData(0,0,500,500),d=img.data,w=500,start=y*w+x,at=start*4;
 const r=d[at],g=d[at+1],b=d[at+2];if(r<105&&g<105&&b<105)return false;
 const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));
 if(!glitter&&Math.abs(r-rgb[0])+Math.abs(g-rgb[1])+Math.abs(b-rgb[2])<15&&!glitterAreas.length)return false;
 const visited=new Uint8Array(250000),queue=new Int32Array(250000);let head=0,tail=1;queue[0]=start;visited[start]=1;

  const neighbors=[];if(px>0)neighbors.push(pos-1);if(px<499)neighbors.push(pos+1);if(py>0)neighbors.push(pos-500);if(py<499)neighbors.push(pos+500);
  for(const q of neighbors){if(visited[q])continue;visited[q]=1;const k=q*4;
   if(Math.abs(d[k]-r)+Math.abs(d[k+1]-g)+Math.abs(d[k+2]-b)>65)continue;
   if(d[k]<110&&d[k+1]<110&&d[k+2]<110)continue;

  }

 let offset=0,started=performance.now();paintLocked=true;
 function frame(now){
  // Around 1.65 seconds for a large region; smaller regions are quicker.
  const duration=Math.min(2100,Math.max(850,tail/55));
  const fraction=Math.min(1,(now-started)/duration);const stop=Math.min(tail,Math.max(offset,Math.ceil(tail*fraction)));

  offset=stop;ctx.putImageData(original,0,0);
  if(offset<tail){animation=requestAnimationFrame(frame)}else{
   // A new fill removes any previous glitter/rainbow effects in the same pixels.
   const filled=new Uint8Array(250000);
   for(let n=0;n<tail;n++)filled[queue[n]]=1;
   for(const area of glitterAreas){
     area.stars=area.stars.filter(p=>!filled[Math.min(249999,Math.max(0,Math.floor(p.y)*500+Math.floor(p.x)))]);
     if(area.maskCanvas){
       const mc=area.maskCanvas.getContext('2d'),mi=mc.getImageData(0,0,500,500);
       for(let n=0;n<tail;n++)mi.data[queue[n]*4+3]=0;
       mc.putImageData(mi,0,0);
     }
   }
   glitterAreas=glitterAreas.filter(a=>a.stars.length>0||a.maskCanvas);
   if(isMagic){const area={effect:chosenEffect,stars:makeStars(queue,tail),hue:Math.random()*360};if(chosenEffect==='rainbow'){const mask=document.createElement('canvas');mask.width=mask.height=500;const mc=mask.getContext('2d');let mi=mc.createImageData(500,500);for(let n=0;n<tail;n++){let j=queue[n]*4;mi.data[j+3]=255}mc.putImageData(mi,0,0);area.maskCanvas=mask;area.overlay=document.createElement('canvas');area.overlay.width=area.overlay.height=500;area.overlayCtx=area.overlay.getContext('2d')}glitterAreas.push(area);startGlitter()}
   paintLocked=false;animation=null;
  }
 }

}
function drawLine(a,b){ctx.strokeStyle=color;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(glitter){for(let i=0;i<6;i++){let t=Math.random(),x=a.x+(b.x-a.x)*t+(Math.random()-.5)*brushSize,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*brushSize;if(Math.random()<.18){glitterAreas.push({effect,stars:[{x,y,size:1.2+Math.random()*2,phase:Math.random()*6.28,speed:1+Math.random()}]});startGlitter()}}}}
