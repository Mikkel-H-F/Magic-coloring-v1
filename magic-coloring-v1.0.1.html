<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Magic Coloring 🦄</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#ffe5f5,#e5f3ff);color:#51375d}main{max-width:1050px;margin:auto;padding:12px}h1{text-align:center;margin:8px;font-size:clamp(26px,5vw,40px)}button,.upload{border:0;border-radius:18px;background:white;color:#51375d;font-weight:750;padding:13px 17px;box-shadow:0 3px 0 #dfc8e7;cursor:pointer;font-size:16px;touch-action:manipulation}button:active{transform:translateY(2px)}button.active{background:#b5e9ff;outline:3px solid #7bb8f3}.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:10px 0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:#fff;border:4px solid #fff;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px #ae91b744;padding:8px;cursor:pointer;text-align:center;font-weight:800;font-size:18px}.tile svg{width:100%;height:auto;max-height:190px}.tile span{display:block;padding:6px}.hide{display:none!important}#paper{background:white;border:8px solid white;border-radius:24px;box-shadow:0 6px 22px #ae91b744;display:block;margin:10px auto;touch-action:none;width:min(100%,650px);aspect-ratio:1/1}#paper svg{width:100%;height:100%;display:block;touch-action:none}#palette{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.swatch{width:49px;height:49px;border-radius:50%;border:4px solid white;box-shadow:0 2px 5px #8765a966;padding:0}.swatch.selected{outline:4px solid #5d3c81;transform:scale(1.07)}.subtitle{text-align:center;font-weight:650}#brushlayer{pointer-events:none}#file{display:none}#toast{text-align:center;min-height:25px;font-weight:750} @media(max-width:650px){.gallery{grid-template-columns:repeat(2,1fr)}.tile{font-size:16px}.row button,.upload{font-size:14px;padding:10px 12px}#paper{border-width:5px}.swatch{width:43px;height:43px}}
</style></head><body><main><h1>🦄 Magic Coloring 🌈</h1><p class="subtitle">Vælg et billede, og mal med dine yndlingsfarver! ✨</p>
<section id="home"><div class="gallery" id="gallery"></div><div class="row"><label class="upload" for="file">📷 Tilføj dit eget billede</label><input type="file" id="file" accept="image/*"></div><p class="subtitle">Egne billeder kan males med penslen. De seks tegninger kan også farvelægges med ét tryk.</p></section>
<section id="editor" class="hide"><div class="row"><button id="back">🏠 Billeder</button><button id="fill" class="active">🪣 Fyld felter</button><button id="brush">🖌️ Pensel</button><button id="size">● Pensel: mellem</button></div><div id="paper"></div><div id="palette"></div><div class="row"><button id="undo">↶ Fortryd</button><button id="clear">✨ Start forfra</button><button id="download">💾 Gem billede</button></div><div id="toast" aria-live="polite"></div></section></main>
<script>
const NS='http://www.w3.org/2000/svg',S=(tag,attrs={},children='')=>`<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ')}>${children}</${tag}>`;
const shape=(tag,attrs)=>S(tag,{...attrs,fill:'white',stroke:'#393047','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round','data-paint':'1'});
const circle=(x,y,r)=>shape('circle',{cx:x,cy:y,r}),ellipse=(x,y,rx,ry)=>shape('ellipse',{cx:x,cy:y,rx,ry}),path=d=>shape('path',{d}),rect=(x,y,w,h,rx=10)=>shape('rect',{x,y,width:w,height:h,rx});
function heart(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})">${path('M 0 18 C -65 -20 -37 -60 0 -32 C 37 -60 65 -20 0 18 Z')}</g>`}
function star(x,y,r=24){let pts=[];for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;pts.push(`${x+Math.cos(a)*q},${y+Math.sin(a)*q}`)}return shape('polygon',{points:pts.join(' ')})}
function cloud(x,y){return `<g transform="translate(${x} ${y})">${path('M -65 25 Q -85 -4 -48 -20 Q -45 -58 -5 -45 Q 32 -78 58 -36 Q 100 -32 83 10 Q 78 30 45 28 Z')}</g>`}
function rainbow(){let out='';for(let i=0;i<6;i++){let r=205-i*24;out+=path(`M ${250-r} 340 A ${r} ${r} 0 0 1 ${250+r} 340 L ${250+r-24} 340 A ${r-24} ${r-24} 0 0 0 ${250-r+24} 340 Z`)}return out+cloud(90,343)+cloud(403,343)+star(80,100)+star(422,102)}
function unicorn(){return `${ellipse(253,365,113,96)}${path('M 178 324 Q 112 267 143 195 Q 191 191 221 261 Z')}${path('M 312 320 Q 383 259 357 192 Q 314 198 281 261 Z')}${path('M 222 194 L 257 72 L 289 194 Z')}${ellipse(250,265,102,105)}${path('M 171 241 Q 169 152 236 171 Q 273 126 326 197 Q 289 195 278 224 Q 240 192 218 236 Z')}${ellipse(218,275,10,15)}${ellipse(289,275,10,15)}${ellipse(251,313,28,20)}${circle(240,311,3)}${circle(263,311,3)}${heart(394,180,.75)}${star(102,115,24)}`}
function butterfly(){return `${ellipse(188,205,88,112)}${ellipse(312,205,88,112)}${ellipse(183,325,75,80)}${ellipse(317,325,75,80)}${ellipse(250,267,24,128)}${circle(250,142,26)}${path('M 236 122 Q 195 60 174 105')}${path('M 264 122 Q 305 60 326 105')}${circle(169,204,26)}${circle(331,204,26)}${circle(181,330,23)}${circle(319,330,23)}`}
function kitty(){return `${path('M 147 216 L 145 100 L 224 153 Q 250 141 277 153 L 353 100 L 353 216 Q 393 317 323 373 Q 250 419 177 373 Q 109 316 147 216 Z')}${path('M 166 179 L 166 139 L 203 168 Z')}${path('M 333 179 L 333 139 L 297 168 Z')}${ellipse(208,263,12,17)}${ellipse(292,263,12,17)}${path('M 235 300 Q 250 316 265 300 Z')}${path('M 250 316 Q 230 346 210 320')}${path('M 250 316 Q 270 346 290 320')}${path('M 179 306 L 104 291')}${path('M 179 322 L 105 329')}${path('M 321 306 L 396 291')}${path('M 321 322 L 395 329')}${heart(394,120,.75)}`}
function bunny(){return `${ellipse(201,145,42,112)}${ellipse(299,145,42,112)}${ellipse(201,145,20,80)}${ellipse(299,145,20,80)}${ellipse(250,310,126,124)}${ellipse(206,295,12,16)}${ellipse(294,295,12,16)}${heart(250,328,.4)}${ellipse(185,355,22,14)}${ellipse(315,355,22,14)}${star(95,350)}${star(405,350)}`}
function hearts(){return heart(250,205,2.5)+heart(115,365,1.2)+heart(388,370,1.25)+heart(92,100,.85)+heart(407,100,.85)+star(252,409,25)+star(250,55,22)}
const pictures=[['🦄 Enhjørning',unicorn],['🌈 Regnbue',rainbow],['🦋 Sommerfugl',butterfly],['🐱 Kat',kitty],['🐰 Kanin',bunny],['💖 Hjerter',hearts]];
const colors=['#ff4d89','#ff9bc5','#ed4e43','#ff9a35','#ffe44e','#99e34f','#2acb8c','#33b9e9','#4979f5','#9b68ee','#bd79b5','#8c5c3b','#444052','#ffffff'];
let color=colors[0],mode='fill',brushSize=12,svg,strokes=[],history=[],custom=null,selected=0;
const $=id=>document.getElementById(id);
function svgContent(inner){return `<svg xmlns="${NS}" viewBox="0 0 500 500" id="art" style="background:white"><rect width="500" height="500" fill="white"/>${inner}<g id="brushlayer"></g></svg>`}
function gallery(){ $('gallery').innerHTML=pictures.map(([name,fn],i)=>`<div class="tile" data-index="${i}">${svgContent(fn())}<span>${name}</span></div>`).join('');document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>open(+t.dataset.index))}
function open(i){selected=i;custom=null;history=[];strokes=[];$('paper').innerHTML=svgContent(pictures[i][1]());initEditor()}
function initEditor(){$('home').classList.add('hide');$('editor').classList.remove('hide');svg=$('art');svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',drag);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('click',paintClick);$('toast').textContent='Vælg en farve og tryk på tegningen!';setMode(custom?'brush':'fill')}
function paintClick(ev){if(mode!=='fill'||custom)return;let el=ev.target.closest('[data-paint]');if(!el||!svg.contains(el))return;snapshot();el.style.fill=color;el.setAttribute('fill',color);$('toast').textContent='Flot! Vælg en ny farve eller mal videre 🌈'}
function snapshot(){history.push(svg.innerHTML);if(history.length>40)history.shift()}
let drawing=false,points=[],strokeEl;
function point(ev){let p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;let m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:250,y:250}}
function down(ev){if(mode!=='brush')return;ev.preventDefault();snapshot();drawing=true;points=[point(ev)];strokeEl=document.createElementNS(NS,'path');strokeEl.setAttribute('fill','none');strokeEl.setAttribute('stroke',color);strokeEl.setAttribute('stroke-width',brushSize);strokeEl.setAttribute('stroke-linecap','round');strokeEl.setAttribute('stroke-linejoin','round');svg.querySelector('#brushlayer').appendChild(strokeEl);svg.setPointerCapture(ev.pointerId);updateStroke()}
function drag(ev){if(!drawing)return;ev.preventDefault();points.push(point(ev));updateStroke()}
function updateStroke(){let d=points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');if(points.length===1)d+=` l .1 .1`;strokeEl.setAttribute('d',d)}
function up(){drawing=false}
function setMode(m){mode=m;$('fill').classList.toggle('active',m==='fill');$('brush').classList.toggle('active',m==='brush');$('fill').disabled=!!custom;$('toast').textContent=m==='fill'?'Tryk på et felt for at fylde det 🪣':'Mal med fingeren 🖌️'}
$('fill').onclick=()=>setMode('fill');$('brush').onclick=()=>setMode('brush');$('size').onclick=()=>{brushSize=brushSize===12?24:brushSize===24?40:12;$('size').textContent='● Pensel: '+({12:'lille',24:'mellem',40:'stor'}[brushSize])};
$('undo').onclick=()=>{if(history.length){svg.innerHTML=history.pop();$('toast').textContent='Sidste ændring fortrudt ↶'}};
$('clear').onclick=()=>{if(confirm('Vil du starte forfra med dette billede?')){if(custom){$('paper').innerHTML=custom;history=[];svg=$('art');initEditor()}else open(selected)}};
$('back').onclick=()=>{$('editor').classList.add('hide');$('home').classList.remove('hide')};
$('palette').innerHTML=colors.map(c=>`<button class="swatch" data-color="${c}" style="background:${c}" aria-label="Farve ${c}"></button>`).join('');
function chooseColor(c){color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x.dataset.color===c))}document.querySelectorAll('.swatch').forEach(x=>x.onclick=()=>chooseColor(x.dataset.color));chooseColor(color);
$('file').onchange=ev=>{let file=ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let data=reader.result;custom=svgContent(`<image href="${data}" x="20" y="20" width="460" height="460" preserveAspectRatio="xMidYMid meet"/>`);$('paper').innerHTML=custom;history=[];initEditor();$('toast').textContent='Dit billede er klar – mal ovenpå med penslen!'};reader.readAsDataURL(file);ev.target.value=''};
$('download').onclick=()=>{let clone=svg.cloneNode(true);clone.removeAttribute('style');clone.setAttribute('width','1000');clone.setAttribute('height','1000');let xml=new XMLSerializer().serializeToString(clone);let blob=new Blob([xml],{type:'image/svg+xml'});let url=URL.createObjectURL(blob);let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1000;let ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1000,1000);ctx.drawImage(img,0,0,1000,1000);URL.revokeObjectURL(url);canvas.toBlob(b=>{let a=document.createElement('a');let u=URL.createObjectURL(b);a.href=u;a.download='magic-coloring.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);$('toast').textContent='Billedet er gemt som PNG! 💖'},'image/png')};img.onerror=()=>{$('toast').textContent='Kunne ikke gemme billedet.'};img.src=url};
gallery();
</script></body></html>
